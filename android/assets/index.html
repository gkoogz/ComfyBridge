<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1014"><title>Comfy Bridge</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="gallery.css"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="generator.css"><link rel="stylesheet" href="desktop.css"><link rel="stylesheet" href="model-browser.css"><link rel="stylesheet" href="provenance.css"><link rel="stylesheet" href="chat.css"><link rel="stylesheet" href="browse.css"><link rel="stylesheet" href="video-player.css"></head>
<body><div id="shade" hidden></div><aside id="drawer" aria-label="ComfyBridge sidebar" inert>
 <div class="drawerTop">
  <div class="drawerHeading"><div class="connectionBadge" data-state="offline"><i class="dot" aria-hidden="true"></i><span id="drawerStatus" role="status">Disconnected</span></div><small id="appVersion" hidden></small></div>
  <div id="drawerConnection"></div>
 </div>
 <div id="drawerBridge"></div>
 <nav aria-label="Workspace">
  <button data-nav="browse"><span aria-hidden="true">◉</span>Browse</button>
  <button data-nav="image"><span aria-hidden="true">▧</span>Image</button>
  <button data-nav="video"><span aria-hidden="true">▷</span>Video</button>
  <button data-nav="library"><span aria-hidden="true">▦</span>Library</button>
  <button data-nav="notepad"><span aria-hidden="true">✎</span>Notepad</button>
 </nav>
</aside>
<div id="workspace"><header><button class="icon" id="hamburger" aria-label="Open menu" aria-controls="drawer" aria-expanded="false">☰</button><div id="headerIdentity"><div class="headtitle" id="pageTitle">Browse</div><span id="browseHello" hidden></span><button id="browseTop" aria-label="Scroll Browse to top" hidden></button></div><button id="presetButton" class="preset" hidden>Current settings <span>⌄</span></button><i class="dot" id="statusDot" aria-label="Disconnected"></i><span id="browseSync" role="status" aria-live="polite" hidden><i aria-hidden="true"></i><span></span></span><button id="browseRefresh" hidden aria-label="Refresh your feed">&#8635;</button><div class="pop" id="presetMenu" hidden></div></header>
<div id="linkNotice" class="warning" role="status" hidden></div><main id="main"></main></div><section id="viewer" role="dialog" aria-label="Media viewer" aria-modal="true" hidden></section><div id="toast" role="status"></div>
<dialog id="modal"><div class="modalhead"><button class="icon" id="modalClose" aria-label="Back"><svg class="backChevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><b id="modalTitle"></b><div id="modalActions"></div></div><div id="modalBody"></div></dialog>
<script src="desktop.js"></script><script src="profile.js"></script><script src="live-image.js"></script><script src="video-player.js"></script><script src="gallery.js"></script><script src="studio.js"></script><script src="notepad.js"></script><script src="chat-format.js"></script><script src="chat.js"></script><script src="generator-controls.js"></script><script src="provenance.js"></script><script src="quick-edit.js"></script><script src="model-cache.js"></script><script src="model-browser.js"></script><script src="prompt-embeddings.js"></script><script src="browse-loader.js"></script><script src="feed-video.js"></script><script src="browse.js"></script><script src="app.js"></script></body></html>
